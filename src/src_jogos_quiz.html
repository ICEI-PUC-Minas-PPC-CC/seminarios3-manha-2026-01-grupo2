<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz de ortografia | Quizzer</title>
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body data-page="quiz">
    <a class="skip-link" href="#conteudo">Pular para o jogo</a>

    <header class="site-header">
      <nav class="nav-shell" aria-label="Navegação principal">
        <a class="brand" href="../index.html">
          <span class="brand-mark" aria-hidden="true">Q</span>
          <span>Quizzer</span>
        </a>
        <div class="nav-links always-visible">
          <a href="../index.html#jogos">Jogos</a>
          <a href="complete-frase.html">Frases</a>
          <a href="memoria.html">Memória</a>
        </div>
      </nav>
    </header>

    <main class="game-page" id="conteudo">
      <section class="game-shell" aria-labelledby="quiz-titulo">
        <div class="game-intro">
          <p class="eyebrow">Jogo 01</p>
          <h1 id="quiz-titulo">Quiz de ortografia</h1>
          <p>Escolha a palavra escrita corretamente. A resposta aparece em texto, sem depender de som.</p>
        </div>

        <div class="play-card">
          <div class="progress-row">
            <span id="quiz-progress">Pergunta 1 de 5</span>
            <span id="quiz-score">0 pontos</span>
          </div>
          <h2 id="quiz-question">Carregando pergunta...</h2>
          <div class="answer-grid" id="quiz-options" aria-label="Opções de resposta"></div>
          <p class="feedback" id="quiz-feedback" role="status" aria-live="polite">Escolha uma opção.</p>
          <button class="button secondary" id="quiz-next" type="button">Próxima pergunta</button>
        </div>
      </section>
    </main>

    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
