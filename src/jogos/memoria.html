<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Memória de palavras | Quizzer</title>
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body data-page="memoria">
    <a class="skip-link" href="#conteudo">Pular para o jogo</a>

    <header class="site-header">
      <nav class="nav-shell" aria-label="Navegação principal">
        <a class="brand" href="../index.html">
          <span class="brand-mark" aria-hidden="true">Q</span>
          <span>Quizzer</span>
        </a>
        <div class="nav-links always-visible">
          <a href="../index.html#jogos">Jogos</a>
          <a href="quiz.html">Quiz</a>
          <a href="complete-frase.html">Frases</a>
        </div>
      </nav>
    </header>

    <main class="game-page" id="conteudo">
      <section class="game-shell" aria-labelledby="memoria-titulo">
        <div class="game-intro">
          <p class="eyebrow">Jogo 3</p>
          <h1 id="memoria-titulo">Memória de palavras</h1>
          <p>Vire duas cartas e encontre o par entre a palavra e sua pista visual.</p>
        </div>

        <div class="play-card">
          <div class="progress-row">
            <span id="memory-status">0 de 6 pares encontrados</span>
            <button class="text-button" id="memory-restart" type="button">Reiniciar</button>
          </div>
          <div class="memory-grid" id="memory-grid" aria-label="Cartas do jogo da memória"></div>
          <p class="feedback" id="memory-feedback" role="status" aria-live="polite">Escolha duas cartas.</p>
        </div>
      </section>
    </main>

    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
